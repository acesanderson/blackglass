[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.workspace]
members = ["blackglass-server", "blackglass-client"]

[project]
name = "blackglass"
version = "0.1.0"

[tool.hatch.build.targets.wheel]
packages = ["src/blackglass"]
sources = ["src"]

[tool.hatch.build.targets.sdist]
include = ["src/blackglass/py.typed"]
